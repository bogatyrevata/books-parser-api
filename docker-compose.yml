services:
  db:
    image: postgres:15
    container_name: books-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/db:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - books-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: books-api
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./logs/api:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - books-network

  frontend:
    build:
      context: ../books-frontend
      dockerfile: Dockerfile
    container_name: books-frontend
    volumes:
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - books-network

  parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    container_name: books-parser
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./logs/parser:/app/logs
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - parser
    restart: "no"
    networks:
      - books-network

volumes:
  postgres_data:

networks:
  books-network:
    name: books-network
